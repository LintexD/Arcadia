[workspace]
resolver = "2"
members = [
    "crates/arcadia-core",
    "crates/arcadia-world",
    "crates/arcadia-physics",
    "crates/arcadia-render",
    "crates/arcadia-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Arcadia Team"]
license = "MIT"

[workspace.dependencies]
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.19", features = ["derive"] }
rayon = "1.10"
wgpu = "23.0"
winit = "0.30"
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
egui = "0.30"
egui-winit = "0.30"
egui-wgpu = "0.30"

[profile.test]
opt-level = 2
incremental = true
codegen-units = 256

[profile.dev]
opt-level = 2
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
needless_pass_by_value = "warn"
explicit_iter_loop = "warn"
semicolon_if_nothing_returned = "warn"